name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Retrieval quality gate (recall@3 >= 0.9)
        run: EMBEDDER=hashing python -m evals.run_eval --min-recall 0.9
      - name: Container builds
        run: docker build -t gemini-agent-hub:ci .
