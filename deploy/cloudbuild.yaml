# gcloud builds submit --config deploy/cloudbuild.yaml --substitutions=_REGION=asia-south1
substitutions:
  _REGION: asia-south1
  _REPO: agent-hub
  _SERVICE: gemini-agent-hub
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: sh
    args: ["-c", "pip install -q -e '.[dev]' && pytest -q && EMBEDDER=hashing python -m evals.run_eval"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=agent-hub-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}
      - --no-allow-unauthenticated
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=5
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
