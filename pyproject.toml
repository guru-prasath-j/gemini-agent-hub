[project]
name = "gemini-agent-hub"
version = "1.0.0"
description = "Enterprise multi-agent assistant on Google ADK + Gemini: hybrid RAG, Workspace tools, guardrails, Cloud Run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guruprasath J" }]
dependencies = [
  "google-adk>=2.0",
  "google-genai>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
]

[project.optional-dependencies]
workspace = ["google-api-python-client>=2.100", "google-auth>=2.30"]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
